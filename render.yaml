# Render Blueprint: free web service running the API + website.
# Database lives on Turso (free) because Render's free plan has no persistent disk.
services:
  - type: web
    name: clickshare
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      npm --prefix backend ci &&
      npm --prefix frontend ci --include=dev &&
      npm --prefix frontend run build
    startCommand: npm --prefix backend run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD # strong password, 12+ characters
        sync: false
      - key: PAYMENT_UPI_ID
        sync: false
      - key: MIN_WITHDRAWAL
        value: "100"
      - key: WITHDRAWAL_FEE
        value: "0"
      - key: USER_REWARD_SHARE
        value: "0.4"
      - key: MAX_REWARD_SHARE
        value: "0.8"
      - key: AUTO_APPROVE_USER_TASKS # true = user tasks go live without admin approval
        value: "false"
      - key: SEED_DEMO
        value: "false"
    # Proof screenshots are saved to backend/data/uploads. On the free plan that
    # folder is wiped on every deploy/restart (the database on Turso is safe).
    # For production, upgrade the plan and add a disk:
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/data/uploads
    #   sizeGB: 1
