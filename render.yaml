# Render Blueprint: one web service that serves the React app + API.
# Render does not host MSSQL - point DB_* at a hosted SQL Server (e.g. Azure SQL).
services:
  - type: web
    name: clickshare
    runtime: node
    plan: free
    buildCommand: >-
      npm --prefix backend install --omit=optional &&
      npm --prefix frontend install --include=dev &&
      npm --prefix frontend run build
    startCommand: npm --prefix backend run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_TRUSTED
        value: "false"
      - key: DB_ENCRYPT
        value: "true"
      - key: DB_SERVER
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_DATABASE
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_UPI_ID
        sync: false
      - key: MIN_WITHDRAWAL
        value: "100"
      - key: WITHDRAWAL_FEE
        value: "0"
      - key: USER_REWARD_SHARE
        value: "0.4"
      - key: MAX_REWARD_SHARE
        value: "0.8"
      - key: SEED_DEMO
        value: "false"
    # Proof screenshots are saved to backend/uploads. On the free plan that folder
    # is wiped on every deploy/restart. For production, upgrade the plan and add:
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1
